<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Audioly - Your Library</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="css/supabase-init.js"></script>
</head>
<body>

    <div class="app-layout">
        <aside class="sidebar-nav">
            <div class="logo-text">Audioly<span>.</span></div>
            <nav class="nav-links">
                <a href="dashboard.html" class="nav-item"><span class="material-symbols-outlined">home</span>Home</a>
                <a href="dashboard.html" class="nav-item"><span class="material-symbols-outlined">search</span>Search</a>
                <a href="#" class="nav-item active"><span class="material-symbols-outlined">library_music</span>Your Library</a>
                <a href="accounts.html" class="nav-item"><span class="material-symbols-outlined">settings</span>Settings</a>
            </nav>
        </aside>

        <main class="main-workspace" style="padding: 32px;">
            <h1>Your Storage Library</h1>

            <div style="margin-top:32px;">
                <h3>Liked Music</h3>
                <table class="library-table">
                    <thead><tr><th>Track Title</th><th>Artist Handle</th></tr></thead>
                    <tbody id="lib-tracks-output"><tr><td colspan="2" style="color:var(--text-muted)">Syncing repository vectors...</td></tr></tbody>
                </table>
            </div>

            <div style="margin-top:48px;">
                <h3>Saved Albums</h3>
                <div class="media-grid" id="lib-albums-output" style="padding:16px 0;"></div>
            </div>

            <div style="margin-top:48px;">
                <h3>Recently Played Audio Tracks</h3>
                <table class="library-table">
                    <tbody id="lib-history-output"></tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            const user = await checkUserSession();
            if (user) {
                renderLikedTracks(user.id);
                renderSavedAlbums(user.id);
                renderListeningHistory(user.id);
            }
        });

        async function renderLikedTracks(uid) {
            const sb = getSupabase();
            const { data } = await sb.from('liked_songs').select('song_id(id, title, artist)').eq('user_id', uid);
            const target = document.getElementById('lib-tracks-output');
            target.innerHTML = '';

            if(!data || data.length === 0) {
                target.innerHTML = `<tr><td colspan="2" style="color:var(--text-muted); text-align:center; padding:16px;">No saved or liked music references found.</td></tr>`;
                return;
            }
            data.forEach(item => {
                if(item.song_id) {
                    target.innerHTML += `<tr><td><strong>${item.song_id.title}</strong></td><td style="color:var(--text-muted)">${item.song_id.artist}</td></tr>`;
                }
            });
        }

        async function renderSavedAlbums(uid) {
            const sb = getSupabase();
            const { data } = await sb.from('saved_albums').select('album_id(id, title, artist, cover_url)').eq('user_id', uid);
            const target = document.getElementById('lib-albums-output');
            target.innerHTML = '';

            if(!data || data.length === 0) {
                target.innerHTML = `<p style="color:var(--text-muted)">No pinned album metadata layers present.</p>`;
                return;
            }
            data.forEach(item => {
                if(item.album_id) {
                    target.innerHTML += `
                        <div class="music-card">
                            <img src="${item.album_id.cover_url}">
                            <h4>${item.album_id.title}</h4>
                            <p style="color:var(--text-muted); font-size:14px;">${item.album_id.artist}</p>
                        </div>
                    `;
                }
            });
        }

        async function renderListeningHistory(uid) {
            const sb = getSupabase();
            const { data } = await sb.from('recently_played').select('song_id(title, artist)').eq('user_id', uid).order('played_at', { ascending: false }).limit(5);
            const target = document.getElementById('lib-history-output');
            target.innerHTML = '';

            data?.forEach(h => {
                if (h.song_id) {
                    target.innerHTML += `<tr><td>🎵 <strong>${h.song_id.title}</strong></td><td style="color:var(--text-muted)">${h.song_id.artist}</td></tr>`;
                }
            });
        }
    </script>
</body>
</html>
