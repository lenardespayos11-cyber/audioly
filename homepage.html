<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Audioly - Who's Listening?</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .profile-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
        }
        .profile-grid {
            display: flex;
            gap: 32px;
            margin-top: 40px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .profile-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
        }
        .avatar-circle {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid transparent;
            transition: all 0.3s;
            margin-bottom: 16px;
        }
        .profile-card:hover .avatar-circle {
            border-color: var(--primary);
            transform: scale(1.05);
        }
        .avatar-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <main class="profile-container">
        <h1>Who is Listening?</h1>
        <div class="profile-grid">
            
            <a href="dashboard.html" class="profile-card">
                <div class="avatar-circle"><img src="images/placeholder-avatar.jpg" alt="Profile"></div>
                <span>Alex Rivers</span>
            </a>

            <a href="dashboard.html" class="profile-card">
                <div class="avatar-circle"><img src="images/placeholder-avatar.jpg" alt="Profile"></div>
                <span>Jordan K.</span>
            </a>

            <a href="accounts.html" class="profile-card">
                <div class="avatar-circle" style="border: 2px dashed var(--text-muted); display:flex; align-items:center; justify-content:center; background:#1e1e1e;">
                    <span style="font-size: 32px; color: var(--text-muted);">+</span>
                </div>
                <span style="color: var(--text-muted)">Add Profile</span>
            </a>

        </div>
    </main>

</body>
</html>
