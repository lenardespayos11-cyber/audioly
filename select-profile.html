<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="utf-8">
    <title>Audioly - Select Profile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { background: "#121212", surface: "#181818" } } }
        }
    </script>
    <script src="css/supabase-init.js"></script>
</head>
<body class="bg-[#121212] text-white antialiased min-h-screen flex flex-col items-center justify-center p-6">

    <div class="text-center mb-12">
        <h1 class="text-4xl font-black tracking-tight mb-2">Who is listening?</h1>
        <p class="text-zinc-500 text-sm">Select a profile context to unlock your audio studio workspace.</p>
    </div>

    <div class="flex flex-wrap items-center justify-center gap-12 max-w-4xl w-full px-4 mb-16" id="profile-cards-grid-hook">
        <p class="text-zinc-500 text-center">Connecting to account vectors...</p>
    </div>

    <div id="creation-control-container" class="flex justify-center">
        <button class="px-6 py-3 border border-zinc-700 rounded-full text-zinc-400 hover:border-white hover:text-white transition-all text-sm font-semibold" onclick="createNewProfileContext()">Create Sub-Profile</button>
    </div>

    <script>
        let currentAccountUser = null;

        // Failsafe: Ensures at least one profile exists matching their signup state
        async function ensureDefaultProfileExists(userId) {
            const sb = getSupabase();
            if (!sb) return;
            try {
                const { data: profiles } = await sb.from('user_profiles').select('id').eq('account_id', userId);
                if (!profiles || profiles.length === 0) {
                    await sb.from('user_profiles').insert([
                        { account_id: userId, profile_name: "Main Listener", avatar_url: "https://api.dicebear.com/7.x/bottts/svg?seed=Main" }
                    ]);
                }
            } catch(e) { console.error(e); }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            currentAccountUser = await checkUserSession();
            if (currentAccountUser) {
                await ensureDefaultProfileExists(currentAccountUser.id);
                renderProfileSelectionGateway();
            }
        });

        async function renderProfileSelectionGateway() {
            const sb = getSupabase();
            try {
                const { data: profiles } = await sb.from('user_profiles').select('*').eq('account_id', currentAccountUser.id);
                const grid = document.getElementById('profile-cards-grid-hook');
                grid.innerHTML = '';

                profiles?.forEach(p => {
                    grid.innerHTML += `
                        <div class="flex flex-col items-center group cursor-pointer w-28 md:w-32 transition-transform duration-200 hover:scale-105" onclick="bootActiveProfileSession('${p.id}')">
                            <div class="relative w-28 h-28 md:w-32 md:h-32 rounded-xl mb-4 overflow-hidden border-2 border-transparent group-hover:border-violet-500 transition-all shadow-xl shadow-black/40">
                                <img src="${p.avatar_url}" class="w-full h-full object-cover">
                            </div>
                            <span class="text-sm font-semibold text-zinc-400 group-hover:text-white transition-colors text-center truncate w-full">${p.profile_name}</span>
                        </div>
                    `;
                });

                // Update visibility parameter metrics if profile threshold maximum of 3 is met
                const controlBox = document.getElementById('creation-control-container');
                if (profiles && profiles.length >= 3) {
                    controlBox.style.display = 'none';
                } else {
                    controlBox.style.display = 'flex';
                }

            } catch(err) { console.error(err); }
        }

        async function createNewProfileContext() {
            const handle = prompt("Enter profile name:");
            if (!handle) return;
            
            const sb = getSupabase();
            
            // Front-end sanity check to prevent database insertion trigger exceptions
            const { data: activeCount } = await sb.from('user_profiles').select('id').eq('account_id', currentAccountUser.id);
            if (activeCount && activeCount.length >= 3) {
                alert("Maximum profile capacity reached. Only 3 profiles are permitted on this updated architecture plan.");
                return;
            }

            const { error } = await sb.from('user_profiles').insert([{ account_id: currentAccountUser.id, profile_name: handle, avatar_url: `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(handle)}` }]);
            if (error) alert(error.message);
            else renderProfileSelectionGateway();
        }

        function bootActiveProfileSession(pid) {
            setActiveProfileId(pid);
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
