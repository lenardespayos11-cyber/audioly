<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Audioly - Your Music, Perfected</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { background: "#121212", surface: "#181818", border: "#2a2a2a", primary: "#8a2be2" }
                }
            }
        }
    </script>
    <script src="css/supabase-init.js"></script>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-background text-white antialiased flex flex-col min-h-screen justify-center items-center p-6 selection:bg-primary/30">

    <div class="w-full max-w-md bg-surface border border-zinc-900 rounded-2xl p-8 shadow-2xl shadow-black/60 space-y-8">
        
        <div class="text-center space-y-2">
            <span class="text-3xl font-black italic text-violet-500 tracking-tight">Audioly.</span>
            <h2 id="form-title" class="text-xl font-bold tracking-tight text-zinc-200">Create Free Account</h2>
            <p id="form-subtitle" class="text-xs text-zinc-500">Sign up below to access customized music profile dashboards.</p>
        </div>

        <form id="auth-form" class="space-y-4" onsubmit="handleAuthFormSubmission(event)">
            
            <div class="flex flex-col gap-1.5">
                <label class="text-xs font-bold uppercase tracking-wider text-zinc-400">Email Address</label>
                <input type="email" id="auth-email-field" placeholder="name@example.com" required 
                    class="w-full bg-[#121212] border-zinc-800 rounded-lg p-3 text-white focus:ring-2 focus:ring-violet-500 focus:border-transparent outline-none transition-all text-sm">
            </div>

            <div class="flex flex-col gap-1.5">
                <label class="text-xs font-bold uppercase tracking-wider text-zinc-400">Password</label>
                <input type="password" id="auth-password-field" placeholder="••••••••" required minlength="6"
                    class="w-full bg-[#121212] border-zinc-800 rounded-lg p-3 text-white focus:ring-2 focus:ring-violet-500 focus:border-transparent outline-none transition-all text-sm">
            </div>

            <div id="username-input-container" class="flex flex-col gap-1.5">
                <label class="text-xs font-bold uppercase tracking-wider text-zinc-400">Choose Profile Name</label>
                <input type="text" id="auth-username-field" placeholder="e.g., lenard"
                    class="w-full bg-[#121212] border-zinc-800 rounded-lg p-3 text-white focus:ring-2 focus:ring-violet-500 focus:border-transparent outline-none transition-all text-sm">
            </div>

            <button type="submit" id="submit-btn" 
                class="w-full py-3 bg-violet-600 hover:bg-violet-500 active:scale-[0.98] text-white font-bold rounded-lg text-sm transition-all shadow-lg shadow-violet-600/10 mt-2">
                Continue
            </button>
        </form>

        <div class="text-center">
            <button id="toggle-mode-link" class="text-xs text-zinc-400 hover:text-white transition-colors underline decoration-zinc-700 underline-offset-4" onclick="toggleFormAuthMode()">
                Already have an account? Log In
            </button>
        </div>

    </div>

    <script>
        let isSignUpMode = true;

        function toggleFormAuthMode() {
            isSignUpMode = !isSignUpMode;
            
            const formTitle = document.getElementById('form-title');
            const formSubtitle = document.getElementById('form-subtitle');
            const usernameContainer = document.getElementById('username-input-container');
            const toggleLink = document.getElementById('toggle-mode-link');
            const usernameField = document.getElementById('auth-username-field');

            if (isSignUpMode) {
                formTitle.innerText = "Create Free Account";
                formSubtitle.innerText = "Sign up below to access customized music profile dashboards.";
                usernameContainer.style.display = "flex";
                usernameField.required = true;
                toggleLink.innerText = "Already have an account? Log In";
            } else {
                formTitle.innerText = "Welcome Back";
                formSubtitle.innerText = "Log into your account credentials to launch your session.";
                usernameContainer.style.display = "none";
                usernameField.required = false;
                toggleLink.innerText = "Don't have an account? Sign Up";
            }
        }

        async function handleAuthFormSubmission(event) {
            event.preventDefault();

            const email = document.getElementById('auth-email-field').value.trim();
            const password = document.getElementById('auth-password-field').value.trim();
            const sb = getSupabase();

            if (!sb) {
                alert("Supabase SDK is not loaded properly. Verify your API initializers.");
                return;
            }

            try {
                if (isSignUpMode) {
                    const username = document.getElementById('auth-username-field').value.trim();
                    if (!username) {
                        alert("Please select a name for your initial streaming profile.");
                        return;
                    }

                    const { data: authData, error: authError } = await sb.auth.signUp({
                        email: email,
                        password: password
                    });

                    if (authError) throw authError;

                    if (authData && authData.user) {
                        // FIXED: Using corrected table name 'user_profiles' and structural metadata columns
                        const { error: profileError } = await sb.from('user_profiles').insert([
                            {
                                account_id: authData.user.id,
                                profile_name: username,
                                avatar_url: `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(username)}`
                            }
                        ]);

                        if (profileError) throw profileError;

                        alert("Registration completed successfully! Redirecting to profile selection...");
                        window.location.href = 'select-profile.html';
                    }
                } else {
                    const { data: logData, error: logError } = await sb.auth.signInWithPassword({
                        email: email,
                        password: password
                    });

                    if (logError) throw logError;

                    if (logData && logData.user) {
                        window.location.href = 'select-profile.html';
                    }
                }
            } catch (err) {
                alert("System Error: " + (err.message || err.details || "An authentication error occurred."));
                console.error(err);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('auth-username-field').required = true;
        });
    </script>
</body>
</html>
